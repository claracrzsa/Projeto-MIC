; Escape Room - DAS 5332
;
; Jogo completo (padrao):
;   pio run -e uno -t upload
;
; Testes de bancada, um por vez:
;   pio run -e teste_1_i2c -t upload
;   pio run -e teste_2_oled -t upload
;   pio run -e teste_3_teclado -t upload
;   pio run -e teste_4_componentes -t upload
;   pio run -e teste_5_buzzer -t upload
;
; Um desafio so, com o fluxo normal do jogo (dificuldade, tempo, erros):
;   pio run -e jogo_fios -t upload
;   pio run -e jogo_cofre -t upload
;   pio run -e jogo_sequencia -t upload
;   pio run -e jogo_hexadecimal -t upload
;
; Monitor serial (9600 baud):
;   pio device monitor

[platformio]
default_envs = uno

[env]
platform = atmelavr
board = uno
framework = arduino
upload_port = COM7
monitor_port = COM7
monitor_speed = 9600
lib_deps = greiman/SSD1306Ascii@^1.3.5

[env:uno]
build_src_filter = +<*> -<testes/>

[env:teste_1_i2c]
build_src_filter = -<*> +<testes/teste_1_i2c.cpp>

[env:teste_2_oled]
build_src_filter = -<*> +<testes/teste_2_oled.cpp>

[env:teste_3_teclado]
build_src_filter = -<*> +<testes/teste_3_teclado.cpp>

[env:teste_4_componentes]
build_src_filter = -<*> +<testes/teste_4_componentes.cpp>

[env:teste_5_buzzer]
build_src_filter = -<*> +<testes/teste_5_buzzer.cpp>

[env:jogo_fios]
build_src_filter = +<*> -<testes/>
build_flags = -DDESAFIO_TESTE=DESAFIO_FIOS

[env:jogo_cofre]
build_src_filter = +<*> -<testes/>
build_flags = -DDESAFIO_TESTE=DESAFIO_COFRE

[env:jogo_sequencia]
build_src_filter = +<*> -<testes/>
build_flags = -DDESAFIO_TESTE=DESAFIO_SEQUENCIA

[env:jogo_hexadecimal]
build_src_filter = +<*> -<testes/>
build_flags = -DDESAFIO_TESTE=DESAFIO_HEXADECIMAL
